name: ESPN Data Sync
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public ESPN league
        run: python fetch_espn.py
      - name: Fetch ESPN NFL headshots
        run: python fetch_player_photos.py
      - name: Collect weekly starters and trades
        run: python collect_extras.py
      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/league.json data/history.json data/team_of_week.json data/trades.json data/player_weekly.json data/player_photos.json
          git diff --cached --quiet || (git commit -m 'Update ESPN league scores and projections' && git push)
